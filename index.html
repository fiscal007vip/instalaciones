<script>

const BIN_ID = "6abf3053ac6210605a0b2fcb";

const API_KEY =
    "$2a$10$z3DhQyCTFmDXTsISGRmSi.lHdT.HYFg9i4jUsZvC9IKUHr2qewG4e";


/* =========================
   DATOS INICIALES
========================= */

let datosGlobales = {
    video1: { comentarios: [] },
    video2: { comentarios: [] },
    video3: { comentarios: [] }
};


let esAdmin =
    localStorage.getItem("fiscal_admin_logged") === "true";


/* =========================
   INICIO
========================= */

document.addEventListener("DOMContentLoaded", function () {

    actualizarEstadoAdminUI();

    cargarDatosNube();

});


/* =========================
   ESTRUCTURA DE DATOS
========================= */

function asegurarDatos() {

    if (!datosGlobales ||
        typeof datosGlobales !== "object") {

        datosGlobales = {};

    }


    if (!datosGlobales.video1) {

        datosGlobales.video1 = {
            comentarios: []
        };

    }


    if (!Array.isArray(datosGlobales.video1.comentarios)) {

        datosGlobales.video1.comentarios = [];

    }


    if (!datosGlobales.video2) {

        datosGlobales.video2 = {
            comentarios: []
        };

    }


    if (!Array.isArray(datosGlobales.video2.comentarios)) {

        datosGlobales.video2.comentarios = [];

    }


    if (!datosGlobales.video3) {

        datosGlobales.video3 = {
            comentarios: []
        };

    }


    if (!Array.isArray(datosGlobales.video3.comentarios)) {

        datosGlobales.video3.comentarios = [];

    }

}


/* =========================
   CARGAR DATOS
========================= */

async function cargarDatosNube() {

    let cargadoDesdeNube = false;


    try {

        const respuesta = await fetch(
            `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,
            {
                method: "GET",

                headers: {
                    "X-Master-Key": API_KEY
                },

                cache: "no-store"
            }
        );


        if (!respuesta.ok) {

            throw new Error(
                "JSONBin respondió: " +
                respuesta.status
            );

        }


        const resultado =
            await respuesta.json();


        if (
            resultado &&
            resultado.record &&
            typeof resultado.record === "object"
        ) {

            datosGlobales =
                resultado.record;


            cargadoDesdeNube = true;

        }


    } catch (error) {

        console.error(
            "Error cargando JSONBin:",
            error
        );

    }


    /*
     * SI JSONBIN FALLA,
     * USAMOS EL RESPALDO LOCAL.
     */

    if (!cargadoDesdeNube) {

        const respaldo =
            localStorage.getItem(
                "fiscal_datos_seguros"
            );


        if (respaldo) {

            try {

                const datosLocales =
                    JSON.parse(respaldo);


                if (
                    datosLocales &&
                    typeof datosLocales === "object"
                ) {

                    datosGlobales =
                        datosLocales;

                }

            } catch (error) {

                console.error(
                    "Error leyendo respaldo local:",
                    error
                );

            }

        }

    }


    asegurarDatos();

    renderizarTodo();

}


/* =========================
   GUARDAR DATOS
========================= */

async function guardarDatosNube() {

    asegurarDatos();


    /*
     * PRIMERO GUARDAMOS LOCALMENTE.
     * ASÍ NO SE PIERDEN SI HAY UN
     * PROBLEMA TEMPORAL CON INTERNET.
     */

    localStorage.setItem(
        "fiscal_datos_seguros",
        JSON.stringify(datosGlobales)
    );


    renderizarTodo();


    /*
     * DESPUÉS GUARDAMOS EN JSONBIN.
     */

    try {

        const respuesta = await fetch(
            `https://api.jsonbin.io/v3/b/${BIN_ID}`,
            {
                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json",

                    "X-Master-Key":
                        API_KEY,

                    "X-Bin-Versioning":
                        "true"
                },

                body:
                    JSON.stringify(
                        datosGlobales
                    )
            }
        );


        if (!respuesta.ok) {

            const textoError =
                await respuesta.text();

            throw new Error(
                "JSONBin " +
                respuesta.status +
                ": " +
                textoError
            );

        }


        console.log(
            "✅ Comentarios guardados en JSONBin."
        );


    } catch (error) {

        console.error(
            "❌ No se pudo guardar en JSONBin:",
            error
        );


        /*
         * NO BORRAMOS LOS DATOS.
         * YA ESTÁN GUARDADOS EN LOCALSTORAGE.
         */

    }

}


/* =========================
   MOSTRAR TODO
========================= */

function renderizarTodo() {

    asegurarDatos();


    const contador1 =
        document.getElementById(
            "commentCount-1"
        );

    const contador2 =
        document.getElementById(
            "commentCount-2"
        );

    const contador3 =
        document.getElementById(
            "commentCount-3"
        );


    if (contador1) {

        contador1.innerText =
            datosGlobales.video1.comentarios.length;

    }


    if (contador2) {

        contador2.innerText =
            datosGlobales.video2.comentarios.length;

    }


    if (contador3) {

        contador3.innerText =
            datosGlobales.video3.comentarios.length;

    }


    renderizarListaComentarios(
        "video1",
        "listaComentarios-1"
    );


    renderizarListaComentarios(
        "video2",
        "listaComentarios-2"
    );


    renderizarListaComentarios(
        "video3",
        "listaComentarios-3"
    );

}


/* =========================
   MOSTRAR COMENTARIOS
========================= */

function renderizarListaComentarios(
    videoId,
    elementId
) {

    const contenedor =
        document.getElementById(
            elementId
        );


    if (!contenedor) return;


    contenedor.innerHTML = "";


    const comentarios =
        datosGlobales[videoId].comentarios;


    if (
        !comentarios ||
        comentarios.length === 0
    ) {

        contenedor.innerHTML =
            `<div class="no-comments">
                No hay comentarios todavía.
            </div>`;

        return;

    }


    comentarios.forEach(
        function (comentario, index) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "comment-item";


            const usuario =
                document.createElement(
                    "div"
                );


            usuario.innerHTML =
                `<strong>@Fiscal 007 VIP</strong>
                 <span class="admin-badge">
                    Admin
                 </span>`;


            const texto =
                document.createElement(
                    "div"
                );


            texto.style.marginTop =
                "4px";


            texto.style.color =
                "#ddd";


            texto.style.wordBreak =
                "break-word";


            /*
             * textContent evita que alguien
             * pueda ejecutar HTML/JS mediante
             * un comentario.
             */

            texto.textContent =
                comentario.texto;


            div.appendChild(
                usuario
            );


            div.appendChild(
                texto
            );


            /*
             * SOLO ADMIN PUEDE ELIMINAR.
             */

            if (esAdmin) {

                const acciones =
                    document.createElement(
                        "div"
                    );


                acciones.className =
                    "comment-actions";


                const eliminar =
                    document.createElement(
                        "span"
                    );


                eliminar.textContent =
                    "Eliminar";


                eliminar.onclick =
                    function () {

                        eliminarComentario(
                            videoId,
                            index
                        );

                    };


                acciones.appendChild(
                    eliminar
                );


                div.appendChild(
                    acciones
                );

            }


            contenedor.appendChild(
                div
            );

        }
    );

}


/* =========================
   ABRIR / CERRAR
========================= */

function toggleComentarios(
    videoId
) {

    let numero = "1";


    if (videoId === "video2") {

        numero = "2";

    }


    if (videoId === "video3") {

        numero = "3";

    }


    const wrapper =
        document.getElementById(
            "commentsWrapper-" +
            numero
        );


    const arrow =
        document.getElementById(
            "arrow-" +
            numero
        );


    if (!wrapper) return;


    if (
        wrapper.classList.contains(
            "open"
        )
    ) {

        wrapper.classList.remove(
            "open"
        );


        if (arrow) {

            arrow.innerText =
                "▼";

        }

    } else {

        wrapper.classList.add(
            "open"
        );


        if (arrow) {

            arrow.innerText =
                "▲";

        }

    }

}


/* =========================
   PUBLICAR COMENTARIO
========================= */

function agregarComentario(
    videoId
) {

    /*
     * SOLO ADMIN.
     */

    if (!esAdmin) {

        alert(
            "Solo el administrador puede publicar comentarios."
        );

        return;

    }


    let numero = "1";


    if (videoId === "video2") {

        numero = "2";

    }


    if (videoId === "video3") {

        numero = "3";

    }


    const input =
        document.getElementById(
            "textoComment-" +
            numero
        );


    if (!input) return;


    const texto =
        input.value.trim();


    if (!texto) {

        alert(
            "Escribe un comentario antes de publicar."
        );

        return;

    }


    asegurarDatos();


    const nuevoComentario = {

        texto: texto,

        fecha:
            new Date().toLocaleString()

    };


    datosGlobales[
        videoId
    ].comentarios.unshift(
        nuevoComentario
    );


    input.value = "";


    guardarDatosNube();

}


/* =========================
   ELIMINAR
========================= */

function eliminarComentario(
    videoId,
    index
) {

    if (!esAdmin) {

        alert(
            "No tienes permisos."
        );

        return;

    }


    if (
        !confirm(
            "¿Seguro que deseas eliminar este comentario?"
        )
    ) {

        return;

    }


    datosGlobales[
        videoId
    ].comentarios.splice(
        index,
        1
    );


    guardarDatosNube();

}


/* =========================
   LOGIN ADMIN
========================= */

function pedirCodigoAdmin() {

    if (esAdmin) {

        const cerrar =
            confirm(
                "¿Quieres cerrar la sesión de Administrador?"
            );


        if (cerrar) {

            esAdmin = false;


            localStorage.removeItem(
                "fiscal_admin_logged"
            );


            actualizarEstadoAdminUI();


            renderizarTodo();

        }


        return;

    }


    const codigo =
        prompt(
            "Introduce el código de Administrador:"
        );


    if (codigo === "007") {

        esAdmin = true;


        localStorage.setItem(
            "fiscal_admin_logged",
            "true"
        );


        alert(
            "🛡️ ¡Modo Administrador activado!"
        );


        actualizarEstadoAdminUI();


        renderizarTodo();

    }

    else if (
        codigo !== null
    ) {

        alert(
            "❌ Código incorrecto."
        );

    }

}


/* =========================
   INTERFAZ ADMIN
========================= */

function actualizarEstadoAdminUI() {

    const boton =
        document.getElementById(
            "adminBtn"
        );


    const cajas = [

        document.getElementById(
            "adminInputBox-1"
        ),

        document.getElementById(
            "adminInputBox-2"
        ),

        document.getElementById(
            "adminInputBox-3"
        )

    ];


    if (esAdmin) {

        if (boton) {

            boton.innerText =
                "🛡️ Admin Activo";


            boton.classList.add(
                "active"
            );

        }


        cajas.forEach(
            function (caja) {

                if (caja) {

                    caja.classList.add(
                        "active"
                    );

                }

            }
        );

    }

    else {

        if (boton) {

            boton.innerText =
                "🔑 Código 007";


            boton.classList.remove(
                "active"
            );

        }


        cajas.forEach(
            function (caja) {

                if (caja) {

                    caja.classList.remove(
                        "active"
                    );

                }

            }
        );

    }

}


/* =========================
   COMPARTIR
========================= */

function compartirWeb() {

    if (
        navigator.share
    ) {

        navigator.share({

            title:
                document.title,

            url:
                window.location.href

        }).catch(
            () => {}
        );

    }

    else {

        navigator.clipboard
            .writeText(
                window.location.href
            )
            .then(
                function () {

                    alert(
                        "🔗 ¡Enlace copiado!"
                    );

                }
            );

    }

}

</script>
